<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Site</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #333;
    }
    header {
      background: #1a73e8;
      color: white;
      padding: 1rem;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin-right: 1rem;
    }
    main {
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    footer {
      text-align: center;
      padding: 1rem;
      background: #f0f0f0;
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>My Site</h1>
      <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>
  <main>
    <section id="home">
      <h2>Welcome</h2>
      <p>This is the base of the site. Use this page as a starting point for your content.</p>
    </section>
    <section id="about">
      <h2>About</h2>
      <p>Describe your site or your project here.</p>
    </section>
    <section id="contact">
      <h2>Contact</h2>
      <p>Provide contact details or links here.</p>
    </section>
  </main>
  <footer>
    <p>&copy; 2026 My Site</p>
  </footer>
</body>
</html>
